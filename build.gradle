plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
}

group 'com.github.chencn.yamlandprops'
version '3.0.0'

ext {
    since = "262"
    until = "262.*"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdea '2026.2'
        bundledPlugin 'com.intellij.java'
    }
}

intellijPlatform {
    pluginConfiguration {
        id = "com.github.yamlandprops"
        name = "Convert YAML and Properties File"
        version = project.version
        changeNotes = """
      <p>3.0.0: <b>drop support for versions before 2026.2; require IntelliJ IDEA 2026.2+.</b></p>
      <p>2.0.10: <b>upgrade version to adapt to new version 262.*</b></p>
      <p>2.0.9: <b>upgrade version to adapt to new version 261.*</b></p>
      <p>2.0.8: <b>upgrade version to adapt to new version 253.*</b></p>
      <p>2.0.5: <b>upgrade version to adapt to new version 2024.3</b></p>
      <p>1.0.5: <b>fix bugs.</b></p>
      <p>1.0.4: <b>fix bugs.</b></p>
      <p>1.0.3: <b>fix YAML file null value exception.</b></p>
      <p>1.0.2: <b>Show menu only with files of specified type.</b></p>
      <p>1.0.0: <b>You can quickly convert <em>Properties</em> files to <em>YAML</em> files, or <em>YAML</em> files to <em>Properties</em> files</b></p>"""

        ideaVersion {
            sinceBuild = since
            untilBuild = until
        }
    }

    pluginVerification {
        ides {
            current()
        }
    }
}
